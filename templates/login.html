<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="/static/Bootstrap-5.3.8/css/bootstrap.min.css">
<style>
    @media(max-width:576px){

        .card{
            padding: 1.5rem !important;
        }

        h2{
            font-size: 1.6rem;
        }

        .form-control{
            font-size:16px; /* prevents iPhone zoom */
        }

    }

    .password-wrapper{
        position:relative;
    }

    .password-wrapper .form-control{
        padding-right:2.75rem;
        background-image:none !important;
    }

    .password-wrapper input[type="password"]::-ms-reveal,
    .password-wrapper input[type="password"]::-ms-clear{
        display:none; /* remove Edge's native eye button */
    }

    .toggle-password{
        position:absolute;
        top:50%;
        right:0.75rem;
        transform:translateY(-50%);
        display:flex;
        align-items:center;
        padding:0.25rem;
        background:transparent;
        border:0;
        color:#6c757d;
        line-height:0;
    }

    .toggle-password:hover{
        color:#212529;
    }

    .toggle-password:focus{
        outline:0;
        box-shadow:none;
    }

    .toggle-password .icon-hide{
        display:none;
    }

    .toggle-password.is-showing .icon-show{
        display:none;
    }

    .toggle-password.is-showing .icon-hide{
        display:block;
    }
</style>
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 p-3">

    <div class="card shadow-sm p-4 w-100" style="max-width: 400px;">

        <h2 class="text-center mb-4">Login</h2>

        {% if error %}
        <div class="alert alert-danger alert-dismissible fade show" role="alert">
            {{ error }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        {% endif %}

        <form action="/login" method="post">

            <div class="mb-3">
                <label for="username" class="form-label">
                    Username
                </label>

                <input 
                    id="username" 
                    name="username" 
                    type="text" 
                    class="form-control"
                    placeholder="Enter username"
                    autocomplete="username"
                    required>
            </div>


            <div class="mb-3">

                <label for="password" class="form-label">
                    Password
                </label>

                <div class="password-wrapper">

                    <input 
                        id="password" 
                        name="password" 
                        type="password" 
                        class="form-control"
                        placeholder="Enter password"
                        autocomplete="current-password"
                        required>

                    <button 
                        type="button"
                        class="toggle-password"
                        data-target="password"
                        aria-label="Show password">

                        <span class="icon-show">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </span>

                        <span class="icon-hide">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                                <line x1="1" y1="1" x2="23" y2="23"/>
                            </svg>
                        </span>

                    </button>

                </div>

            </div>


            <button type="submit" class="btn btn-primary w-100">
                Login
            </button>

        </form>


        <p class="text-center mt-3 mb-0">
            Don’t have an account?
            <a href="/register" class="text-decoration-none">
                Register
            </a>
        </p>

    </div>

    <script>
        document.querySelectorAll(".toggle-password").forEach(function (button) {

            button.addEventListener("click", function () {

                var input = document.getElementById(button.dataset.target);
                var hidden = input.type === "password";

                input.type = hidden ? "text" : "password";
                button.classList.toggle("is-showing", hidden);
                button.setAttribute("aria-label", hidden ? "Hide password" : "Show password");

                input.focus();

            });

        });
    </script>
</body>
</html>
