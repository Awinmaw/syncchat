<script>

  const username = "{{ username }}";

  const unreadCounts = {};
  const onlineUsers = {}; // *Map to track online status of users (important for public chat and user list updates)*
  const lastSeenUsers = {};
  const newChatUsers = {};
  
  let currentReceiver = null;
  let totalUsersCount = 0;

  // for websocket connect
  let ws = null;
  let reconnectTimer = null;
  let manualClose = false;
  let socketId = 0;

  // render messages array
  function renderMessages(messages) {
  const messagesDiv = document.getElementById("messages");
  
  // Check scroll position BEFORE clearing messages
  const wasNearBottom =
      messagesDiv.scrollHeight -
      messagesDiv.scrollTop -
      messagesDiv.clientHeight < 80;

  messagesDiv.innerHTML = "";

  messages.forEach(msg => {
    // wrapper row
    const row = document.createElement("div");
    row.className = msg.sender === username ? "message-row me" : "message-row other";

    // avatar circle (only for received messages)
    if (msg.sender !== username) {
      const avatar = document.createElement("div");
      
      avatar.className = "avatar-circle-public";
      avatar.style.backgroundColor = msg.avatar_color;
      avatar.textContent = (msg.sender || "?").charAt(0).toUpperCase(); // initial character of sender
      avatar.setAttribute("data-username", msg.sender);

      const statusDot = document.createElement("span");
      statusDot.className = `status-dot-public ${isUserOnline(msg.sender) ? 'status-online' : 'status-hidden'}`;
      avatar.appendChild(statusDot);

      row.appendChild(avatar);
    }

    // bubble
    const bubble = document.createElement("div");
    bubble.className = msg.sender === username ? "message me" : "message other";

    // sender
    const sender = document.createElement("strong");
    if (msg.deleted_user) {
        sender.textContent = "Deleted User";
        sender.classList.add("deleted-user");
    } else {
        sender.textContent = msg.sender === username ? "You" : msg.sender;
    }
    
    bubble.appendChild(sender);

    // message text
    const msgText = document.createElement("div");
    msgText.style.whiteSpace = "pre-wrap"; // handle (shift+enter) in sent message
    msgText.textContent = msg.message;
    bubble.appendChild(msgText);

    // horizontal line
    const footer = document.createElement("div");
    footer.className = "msg-footer";

    const divider = document.createElement("div");
    divider.className = "msg-divider";
    footer.appendChild(divider);
    
    // timestamp
    const time = document.createElement("small");
    time.className = "timestamp text-muted d-block";
    
    time.textContent = formatTime(msg.sent_at);
    
    // Read status (only my messages)
    if(msg.sender === username){

        const readStatus = document.createElement("span");

        readStatus.className = "read-status ms-1";

        readStatus.dataset.messageId = msg.id;

        readStatus.innerHTML =
            (msg.is_read || msg.public_seen)
            ? "✓✓"
            : "✓";


        if (msg.public_seen) {
            readStatus.classList.add("black");
        }

        time.appendChild(readStatus);
    }

    //bubble.appendChild(time);
    footer.appendChild(time);
    bubble.appendChild(footer);
    row.appendChild(bubble);
    messagesDiv.appendChild(row);
  });

  //messagesDiv.scrollTop = messagesDiv.scrollHeight;
    if (wasNearBottom || messagesDiv.scrollHeight === 0) {
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }
}

// helper to append a single message row (used for incoming WebSocket messages)
function appendMessageRow(msg) {
  const messagesDiv = document.getElementById("messages");

  // Check BEFORE adding the new message if the user is near the bottom
  const wasNearBottom =
      messagesDiv.scrollHeight -
      messagesDiv.scrollTop -
      messagesDiv.clientHeight < 80;
  
  const row = document.createElement("div");
  row.className = msg.sender === username ? "message-row me" : "message-row other";

  if (msg.sender !== username) {
    const avatar = document.createElement("div");
    avatar.className = "avatar-circle-public";
    avatar.style.backgroundColor = msg.avatar_color;
    avatar.textContent = (msg.sender || "?").charAt(0).toUpperCase();

    // Store full username for reliable matching
    avatar.setAttribute("data-username", msg.sender);

    // Add status dot on public chat messages
    const statusDot = document.createElement("span");
    statusDot.className = `status-dot-public ${isUserOnline(msg.sender) ? 'status-online' : 'status-hidden'}`;
    avatar.appendChild(statusDot);

    row.appendChild(avatar);
  }

    const bubble = document.createElement("div");
    bubble.className = msg.sender === username ? "message me" : "message other";

    // sender
    const sender = document.createElement("strong");
    if (msg.deleted_user) {
        sender.textContent = "Deleted User";
        sender.classList.add("deleted-user");
    } else {
        sender.textContent = msg.sender === username ? "You" : msg.sender;
    }

    bubble.appendChild(sender);

    // message text
    const msgText = document.createElement("div");
    msgText.style.whiteSpace = "pre-wrap"; // handle (shift+enter) for sent meaasge
    msgText.textContent = msg.message;
    bubble.appendChild(msgText);

    // horizontal line
    const footer = document.createElement("div");
    footer.className = "msg-footer";

    const divider = document.createElement("div");
    divider.className = "msg-divider";
    footer.appendChild(divider);

    // timestamp
    const time = document.createElement("small");
    time.className = "timestamp text-muted d-block";

    time.textContent = formatTime(msg.sent_at);

    // Read status (only my messages)
    if(msg.sender === username){

        const readStatus = document.createElement("span");

        readStatus.className = "read-status ms-1";

        readStatus.dataset.messageId = msg.id;

        readStatus.innerHTML =
            (msg.is_read || msg.public_seen)
            ? "✓✓"
            : "✓";


        if(msg.is_read || msg.public_seen){
            readStatus.classList.add("blue");
        }

        time.appendChild(readStatus);
    }

    //bubble.appendChild(time);
    footer.appendChild(time);
    bubble.appendChild(footer);
    row.appendChild(bubble);
    messagesDiv.appendChild(row);

    //messagesDiv.scrollTop = messagesDiv.scrollHeight;
    
    // only scroll to bottom if the user was already near the bottom before the new message arrived
    if (wasNearBottom) {
        messagesDiv.scrollTo({
            top: messagesDiv.scrollHeight,
            behavior: "smooth"
        });
    }
}

function formatTime(sent_at) {
    //if (!sent_at) return "Just now";
    console.log("TIME RECEIVED:", sent_at);
    return new Intl.DateTimeFormat("en-US", {
        year: "numeric",
        month: "short",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        hour12: true,
        timeZone: "Asia/Yangon"
    }).format(new Date(sent_at));
}


// Handle incoming WebSocket messages
async function handleIncomingMessage(event) {
  const data = JSON.parse(event.data);

  // typing behavior
  if(data.type === "typing"){

    showTypingStatus(
        data.username,
        data.typing
    );

    return;
}

  if(data.type === "messages_seen"){

      console.log(
          "Messages seen by:",
          data.reader
      );
  
      updateReadStatus(data.last_read_id);
  
      return;
  }

  // Public chat read receipt
  if(data.type === "public_message_seen"){

      console.log(
          "PUBLIC MESSAGE SEEN:",
          data.message_id
      );


      const tick = document.querySelector(
          `.read-status[data-message-id="${data.message_id}"]`
      );


      if(tick){

          tick.innerHTML = "✓✓";

          tick.classList.add("blue");

      }


      return;
  }
  

  if (data.type === "message") {
    
    // Play sound immediately
    if (data.sender !== username) {
        document.getElementById("receiveSound").play();
    } else {
        document.getElementById("sendSound").play();
    }

    
    // Public Chat
    if (!currentReceiver && data.room_type === "public") {

        appendMessageRow(data);
        
        // tell server we viewed public message
        if(
            data.sender !== username &&
            ws &&
            ws.readyState === WebSocket.OPEN
        ){

            ws.send(JSON.stringify({
                type:"public_seen",
                message_id:data.id
            }));

        }

    }

    // Private Chat
    if (currentReceiver) {

        if (
            data.sender === currentReceiver ||
            data.sender === username
        ) {

            appendMessageRow(data);
            
            // auto mark as read
            if(
                data.sender === currentReceiver &&
                ws &&
                ws.readyState === WebSocket.OPEN
            ){

                if(data.id > lastReadMessageId){

                    lastReadMessageId = data.id;

                    ws.send(JSON.stringify({
                        type:"mark_read",
                        receiver: currentReceiver
                    }));

                }

            }

        }
    }

    // Update recent chats
    if (data.room_type === "private") {

        let chatUser =
            data.sender === username
            ? data.receiver
            : data.sender;

        updateSidebarChat({
            sender: chatUser,
            last_sender: data.sender === username ? "You" : data.sender,
            message: data.message,
            sent_at: data.sent_at
        });

    }

    return;
  }


  if(data.type === "chat_update"){

    let chatUser;

    // message from another user
    if(data.sender !== username){
        
        chatUser = data.sender;

        if(currentReceiver !== chatUser){
            console.log("ADDING UNREAD BADGE FOR:", chatUser);
            
            unreadCounts[chatUser] = (unreadCounts[chatUser] || 0) + 1;
        }

        if(!document.querySelector(
            `button[data-username="${chatUser}"]`
        )){
            newChatUsers[chatUser] = true;
        }
    }
    else{
        // my own sent message
        chatUser = data.receiver;

    }

    updateSidebarChat({        
        // calling from websocket
        sender: chatUser,
        avatar_color: data.avatar_color,
        last_sender: data.last_sender,
        message: data.message,
        sent_at: data.sent_at

    });

    if(currentReceiver !== chatUser){
        updateUnreadBadge(chatUser);
    }

    return;
}

  if (data.type === "presence") {

    onlineUsers[data.username] = data.online;   // ✅ keep map updated

    if(data.last_seen){
        lastSeenUsers[data.username] = data.last_seen;
    }
    
    updateUserStatus(
        data.username, 
        data.online,
        data.last_seen
    );

    return; // stop here, don’t render as a chat bubble

  }

  if (data.type === "presence_init") {

    // clear old online cache
    /*Object.keys(onlineUsers).forEach(u => {
        delete onlineUsers[u];
    });*/
    
    data.users.forEach(u => {

      onlineUsers[u.username] = u.online;     // ✅ keep map updated
      if(u.last_seen){
            lastSeenUsers[u.username] = u.last_seen;
        }

      updateUserStatus(u.username, u.online, u.last_seen);

    });

    updatePublicStats();
    return;
  }

    if(data.type === "new_chat"){
        
        console.log("NEW CHAT CREATED:", data.username);

        newChatUsers[data.username] = true;

        setTimeout(()=>{
            loadChats();
        },100);

        return;
    }

}


// these four for typing behavior
let isTyping = false;
let typingTimer = null;
let typingAnimationTimer = null;
let typingDots = 0;

let lastReadMessageId = 0;

function updateUserStatus(username, online, last_seen=null) {
  onlineUsers[username] = online;

  // Update user buttons (sidebar)
  const userButtons = document.querySelectorAll("#users button");

  userButtons.forEach(btn => {
    
    if (btn.dataset.username === username) {
      const dot = btn.querySelector(".status-dot");

      if (dot) {
          dot.className = `status-dot ${online ? "status-online" : "status-hidden"}`;
      }
  }
  });

  // Update top bar if currently chatting with this user
  const headerUser = document.querySelector("#chatHeader .username");
  if (headerUser && headerUser.textContent.trim() === username) {
    const userInfo = headerUser.parentElement; // .user-info container

    // Dot
    //let statusDot = userInfo.querySelector(".status-dot");
    //if (statusDot) {
    //  statusDot.className = `status-dot ${online ? 'status-online' : 'status-offline'}`;
    //}

    // Text
    let statusText = userInfo.querySelector(".status");
    if (statusText) {

        if(!online && last_seen){
            lastSeenUsers[username] = last_seen;
        }

        statusText.textContent = online ? "online" : formatLastSeen(lastSeenUsers[username]);
        statusText.className = `status ${online ? 'online-text' : 'offline-text'}`;
      
    }
  }
  
  // Update public chat avatars
  const chatAvatars = document.querySelectorAll(".avatar-circle-public");
  chatAvatars.forEach(avatar => {
    if (avatar.getAttribute("data-username") === username) {
      const statusDot = avatar.querySelector(".status-dot-public");
      if (statusDot) {
        // can be placed last seen recently (status-offline)
        statusDot.className = `status-dot-public ${online ? 'status-online' : 'status-hidden'}`;
      }
    }
  });

    // function call for total users calculation
    updatePublicStats();
}

function isUserOnline(username) {
  return !!onlineUsers[username];
}

  // Fetch PUBLIC messages
  async function loadPublicMessages() {
    const response = await fetch("/messages");
    const data = await response.json();
    renderMessages(data);

    // Mark public messages as seen after opening Public Chat
    data.forEach(msg => {

        if(msg.sender !== username){

            ws.send(JSON.stringify({
                type: "public_seen",
                message_id: msg.id
            }));

        }

    });

    // After rebuilding messages, re‑apply presence state
    Object.keys(onlineUsers).forEach(u => {
      updateUserStatus(u, onlineUsers[u], lastSeenUsers[u]);
    });
  }

  // Fetch PRIVATE messages
  async function loadMessagesForRoom(receiver) {
    const response = await fetch("/messages?receiver=" 
                                + encodeURIComponent(receiver) 
                                + "&username=" + encodeURIComponent(username));
    const data = await response.json();
    renderMessages(data);

    // After rebuilding messages, re‑apply presence state
    Object.keys(onlineUsers).forEach(u => {
      updateUserStatus(u, onlineUsers[u], lastSeenUsers[u]);
    });
  }


// last seen format
function formatLastSeen(time){

    if(!time){
        return "last seen recently";
    }

    const date = new Date(time);

    if(isNaN(date.getTime())){
        console.log("Invalid last_seen:", time);
        return "last seen recently";
    }


    const diff = Math.floor(
        //(new Date() - date) / 60000
        (Date.now() - date.getTime()) / 60000
    );


    if(diff < 1)
        return "last seen just now";


    if(diff < 60)
        return `last seen ${diff} min ago`;


    const hours = Math.floor(diff / 60);


    if(hours < 24)
        return `last seen ${hours} hour ago`;


    const days = Math.floor(hours / 24);

    return `last seen ${days} day ago`;
}


// display function for typing behavior
function showTypingStatus(user, typing){

    // only affect current private chat
    if(currentReceiver !== user){
        return;
    }


    const status = document.querySelector(
        "#chatHeader .status"
    );


    if(!status){
        return;
    }


    if(typing){

        status.className = "status online-text";


        if(!typingAnimationTimer){

            typingDots = 0;

            typingAnimationTimer = setInterval(()=>{

                typingDots++;

                if(typingDots > 3){
                    typingDots = 0;
                }


                status.textContent = ".".repeat(typingDots) + "typing";

            },400);

        }


    }else{

        // stop animation
        if(typingAnimationTimer){

            clearInterval(typingAnimationTimer);

            typingAnimationTimer = null;

        }


        status.textContent =
            isUserOnline(user)
            ? "online"
            : formatLastSeen(lastSeenUsers[user]);


        status.className =
            `status ${
                isUserOnline(user)
                ? "online-text"
                : "offline-text"
            }`;

    }

}


// Helper to connect WebSocket
function connectWebSocket(url) {

    const currentSocketId = ++socketId;
    let intentionalClose = false;

  // Cancel previous reconnect timer
  if (reconnectTimer) {
    clearTimeout(reconnectTimer);
    reconnectTimer = null;
  }

  // Close old connection intentionally
  if (ws) {

    ws.onclose = null;
    ws.onerror = null;

    intentionalClose = true;

    ws.close();
  }

  ws = new WebSocket(url);


  //document.getElementById("sendBtn").disabled = true;
  const sendBtn = document.getElementById("sendBtn");

  if(sendBtn){
      sendBtn.disabled = true;
  }

  ws.onopen = () => {

        if(currentSocketId !== socketId){
            return;
        }

        console.log("WS OPEN");
        console.log("Connected to " + url);

        //manualClose = false;

        if(sendBtn){
            sendBtn.disabled = false;
        }

        // only private chat
        if(currentReceiver && url.includes("receiver=")){

            if(ws.readyState === WebSocket.OPEN){

                ws.send(JSON.stringify({
                    type:"mark_read",
                receiver: currentReceiver
                }));

            }

            console.log("Private chat opened -> mark_read sent");
        }
        

        // Wait until websocket is connected before sending public_seen
        // If currently in Public Chat
        if (
            currentReceiver === null &&
            currentSocketId === socketId
        ){
            loadPublicMessages();
        }

        // refresh recent chats after websocket ready
        setTimeout(() => {

            if(currentSocketId !== socketId){
                return;
            }
            loadChats();

        }, 500);
  };


  ws.onmessage = handleIncomingMessage;

  ws.onclose = (e) => {
    
    console.log("WS CLOSED", e.code);
    // Ignore old websocket closing
    if(currentSocketId !== socketId){
        console.log("Old websocket ignored");
        return;
    }

    console.log("Closed:", e.code, e.reason);

    //document.getElementById("sendBtn").disabled = true;
    if(currentSocketId === socketId){

        document.getElementById("sendBtn").disabled = true;

    }


    // Ignore intentional close
    if (intentionalClose) {
      console.log("Manual close, no reconnect");
      return;
    }


    reconnectTimer = setTimeout(() => {

      console.log("Attempting reconnect...");

      connectWebSocket(url);

      // refresh recent chats after reconnect
      loadChats();

    },3000); // auto reconnect after 3s
    
  };


  ws.onerror = (err) => {
    console.error("WebSocket error:", err);
  };
}

  if (input.value.trim() !== "") {

      console.log("ws.readyState =", ws.readyState);

      return;
    }

    ws.send(JSON.stringify({
      sender: username,
      message: input.value
    }));

    //document.getElementById("sendSound").play();
    input.value = "";

    input.style.height = "auto";
    input.style.height = "24px";
    input.style.overflowY = "hidden";
    input.style.overflowY = "hidden";
  }
}

// Load chat
async function loadChats() {

        const userResponse = await fetch("/users");


        if(!userResponse.ok){
            throw new Error(
                "Failed loading users: " + userResponse.status
            );
        }


        const users = await userResponse.json();
        if(requestId !== chatsRequestId){
            return;
        }

        totalUsersCount = users.length;

        const response = await fetch(
            "/chats?username=" + encodeURIComponent(username)
        );

        const chats = await response.json();
        const uniqueChats = [
            ...new Map(
                chats.map(chat => [chat.username, chat])
            ).values()
        ];

        console.log("UNIQUE CHATS:", uniqueChats);

            return;

                                ${

                );

                loadMessagesForRoom(chat.username);

                //setTimeout(()=>{
                //    markChatAsRead(chat.username);
                //},300);

        // remove duplicate chat buttons

        //document.querySelectorAll("#users button").forEach(btn => {

// private chat history clear function
async function clearCurrentChat(){

    if(!currentReceiver)
        return;


    if(!confirm("Are you sure to clear chat history?")){
        return;
    }

    const chatUser = currentReceiver;
    //const deletedUser = currentReceiver;
    
    // save avatar in a variable
    const oldAvatar =
        document.querySelector(
            `button[data-username="${chatUser}"] .mini-avatar`
        )?.style.background || "#999";

        
    const response = await fetch(
        "/clear_chat?username="
        + encodeURIComponent(username)
        + "&contact_username="
        + encodeURIComponent(chatUser),
        {
            method:"POST"
        }
    );


    const result = await response.json();


    if(result.success){
        
        //document.querySelector(
        //    `button[data-username="${currentReceiver}"]`
        //)?.remove();

        // close three dots menu
        const menu = document.getElementById("chatActionMenu");

            menu.remove();
        }

        //currentReceiver = null;

        currentReceiver = chatUser;
        lastReadMessageId = 0;

        // clear current messages
        document.getElementById("messages").innerHTML = "";

        //await loadMessagesForRoom(deletedUser);

        // reload sidebar but keep current user
        await loadChats();

            username: chatUser,

        });

        // popup message
        showToast(
            "Chat history cleared successfully",
            "fa-trash"
        );
    }

}


// auto refresh recent chat
function updateSidebarChat(msg){
    
    // Ignore public chat messages
    let chatUser = msg.sender;

    if(!chatUser){
        return;
    }

    const usersDiv = document.getElementById("users");

    // Find existing chat button
    let buttons = usersDiv.querySelectorAll(
        `button[data-username="${chatUser}"]`
    );

    // remove duplicate buttons if already exists
    if (buttons.length > 1) {
        buttons.forEach((b, index) => {
            if (index > 0) {
                b.remove();
            }
        });
    }

    let btn = usersDiv.querySelector(
        `button[data-username="${chatUser}"]`
    );

    // If chat does not exist yet (first message)
    if(!btn){

        btn = document.createElement("button");
        btn.className = "btn chat-user-btn w-100 mb-2";
        btn.dataset.username = chatUser;
        btn.dataset.avatarColor = msg.avatar_color || "";

        btn.onclick = function(){

            connectWebSocket(
                getWebSocketUrl(
                    "/ws?username="
                    + encodeURIComponent(username)
                    + "&receiver="
                    + encodeURIComponent(chatUser)
                )
            );

            loadMessagesForRoom(chatUser);
            showPrivateHeader({
                username: chatUser,
                avatar_color: msg.avatar_color
            });

            if(window.innerWidth < 768){
                sidebar.classList.remove("active");
            }
        };

        // Add new chat at top
        if (btn.parentElement !== usersDiv) {
            usersDiv.prepend(btn);
        }
    }

    if(msg.avatar_color){
        btn.dataset.avatarColor = msg.avatar_color;
    }

    const currentUnread = unreadCounts[chatUser] || 0;
    const currentOnline = onlineUsers[chatUser] === true;

    let currentAvatarColor = 
        msg.avatar_color ||
        btn.dataset.avatarColor ||
        btn.querySelector(".mini-avatar")?.style.background ||
        "#999";

    btn.dataset.avatarColor = currentAvatarColor;

    // Update button content
    btn.innerHTML = `
        <div class="d-flex justify-content-between align-items-start">
            <div class="text-start flex-grow-1">
                <div class="d-flex align-items-center">

                    <span class="mini-avatar"
                          style="background:${currentAvatarColor}">

                        ${chatUser.charAt(0).toUpperCase()}

                    </span>
                    <strong>${chatUser}</strong>

                    <span class="status-dot ${
                        currentOnline
                        ? "status-online"
                        : "status-hidden"
                    }"></span>

                </div>
                <div class="text-muted small message-preview" style="margin-left: 40px">
                    ${msg.last_sender || msg.sender}: ${msg.message}
                </div>
                <div class="text-muted small" style="margin-left: 40px">                    
                    <small>
                      ${formatTime(msg.sent_at)}
                    </small>
                </div>

            </div>            
            <span class="unread-badge" 
                  style="${currentUnread  ? '' : 'display:none'}">
                  ${currentUnread}
            </span>
                ${
                    newChatUsers[chatUser]
                    ?
                    `
                    <span 
                        class="badge rounded-pill bg-primary ms-1"
                        style="font-size:11px; float: right; margin-top: 1px;">
                        New
                    </span>
                    `
                    :
                    ""
                }
        </div>

    `;

    // Move this chat to the top
    usersDiv.prepend(btn);

    // restore online dot after rebuilding
    updateUserStatus(
        chatUser,
        onlineUsers[chatUser] === true
    );
}

// noti Badge
function refreshUnreadBadge(chatUser){
    const btn = document.querySelector(
        `button[data-username="${chatUser}"]`
    );

    if(!btn) return;

    let badge = btn.querySelector(".unread-badge");

    if(unreadCounts[chatUser] > 0){

        if(!badge){
            badge = document.createElement("span");
            badge.className = "unread-badge";
            btn.appendChild(badge);
        }

        badge.textContent = unreadCounts[chatUser];

    }else{
        if(badge){
            badge.remove();
        }
    }
}


function updateUnreadBadge(chatUser) {

    const btn = document.querySelector(
        `button[data-username="${chatUser}"]`
    );

    if (!btn) return;

    const badge = btn.querySelector(".unread-badge");

    if (!badge) return;

    if (unreadCounts[chatUser] > 0) {
        badge.textContent = unreadCounts[chatUser];
        badge.style.display = "flex";
    } else {
        badge.style.display = "none";
    }
}


function getWebSocketUrl(path) {
    const protocol = location.protocol === "https:" 
        ? "wss://" 
        : "ws://";

    return protocol + location.host + path;
}

    }

// check read/unread message
function markChatAsRead(){

    // only private chat
    if(!currentReceiver){
        return;
    }

    unreadCounts[currentReceiver] = 0;

    updateUnreadBadge(currentReceiver);

    if(ws && ws.readyState === WebSocket.OPEN){

        ws.send(JSON.stringify({
            type:"mark_read",
            receiver: currentReceiver
        }));

        console.log("sent mark_read", currentReceiver);
    }
}

        this.style.height = "0px";

        this.style.overflowY =

        // Private chat only
        if (!currentReceiver) return;

        if (!isTyping) {
            isTyping = true;

            ws.send(JSON.stringify({
                type: "typing"
            }));
        }

        clearTimeout(typingTimer);

        typingTimer = setTimeout(() => {

            isTyping = false;

            ws.send(JSON.stringify({
                type: "stop_typing"
            }));

        }, 1500);

    });

function updateReadStatus(lastReadId){

    document
    .querySelectorAll(".read-status")

            Number(status.dataset.messageId);


        if(messageId <= lastReadId){

            status.innerHTML = "✓✓";

            status.classList.add("read");

        }

    });

}
