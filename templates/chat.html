function scrollMessagesToBottom(behavior = "auto") {

    const messagesDiv = document.getElementById("messages");

    if (!messagesDiv) return;

    // Wait for DOM/layout update
    requestAnimationFrame(() => {

        requestAnimationFrame(() => {

            messagesDiv.scrollTo({
                top: messagesDiv.scrollHeight,
                behavior: behavior
            });

        });

    });
}

// helper to update audio duration display
function formatAudioTime(seconds) {

    if (!Number.isFinite(seconds) || seconds < 0) {
        return "0:00";
    }

    const minutes = Math.floor(seconds / 60);

    const remainingSeconds = Math.floor(seconds % 60)
        .toString()
        .padStart(2, "0");

    return `${minutes}:${remainingSeconds}`;
}


function updateAudioDuration(audio, durationElement) {

    if (!Number.isFinite(audio.duration)) {
        durationElement.textContent = "0:00";
        return;
    }

    durationElement.textContent =
        formatAudioTime(audio.duration);
}

// helper to create an audio message element
let currentlyPlayingAudio = null;
let currentlyPlayingButton = null;

function createAudioMessage(msg) {

    console.log("========== AUDIO MESSAGE ==========");
    console.log("ID:", msg.id);
    console.log("URL:", msg.media_url);
    console.log("TYPE:", msg.message_type);
    console.log("DURATION FROM SERVER:", msg.duration);
    console.log("FULL MESSAGE:", msg);
    console.log("====================================");

    const audioWrapper = document.createElement("div");

    audioWrapper.className = "chat-audio-wrapper";

    const playBtn = document.createElement("button");

    playBtn.className = "chat-audio-play";
    playBtn.innerHTML = '<i class="fa-solid fa-play fa-sm"></i>';


    const duration =  document.createElement("span");

    duration.className = "chat-audio-duration";

    const audio = document.createElement("audio");

    audio.className = "chat-message-audio-hidden";
    audio.preload = "auto";


    // INITIAL DURATION
    let originalDuration = 0;

    duration.textContent =  "…";

    // METADATA DURATION
    function updateDurationFromAudio() {

        const d = audio.duration;

        console.log("AUDIO DURATION CHECK:", d);

        if (
            Number.isFinite(d) &&
            d > 0
        ) {

            originalDuration = d;

            duration.textContent = formatAudioTime(d);
            console.log("AUDIO REAL DURATION:", d);
            return true;
        }

        // WebM/Opus can temporarily report Infinity.
        if (d === Infinity) {

            console.log("AUDIO DURATION IS INFINITY - SEEKING TO END");
            
        }

        return false;
    }

    audio.addEventListener(
        "loadedmetadata",
        () => {

            console.log(
                "AUDIO METADATA LOADED:",
                audio.duration
            );

            updateDurationFromAudio();

        }
    );


    audio.addEventListener(
        "durationchange",
        () => {

            updateDurationFromAudio();

        }
    );

    audio.addEventListener(
        "canplay",
        () => {

            console.log(
                "AUDIO CAN PLAY:",
                audio.duration
            );

            updateDurationFromAudio();

        }
    );

    // REMAINING TIME
    audio.addEventListener(
        "timeupdate",
        () => {

            if (
                !Number.isFinite(audio.duration) ||
                audio.duration <= 0
            ) {
                return;
            }


            const remaining =
                Math.max(
                    0,
                    audio.duration -
                    audio.currentTime
                );


            duration.textContent =
                formatAudioTime(remaining);

        }
    );


    // PLAY / PAUSE
    playBtn.addEventListener("click", async function (event) {

        event.preventDefault();
        event.stopPropagation();

        // THIS AUDIO IS ALREADY PLAYING
        if (!audio.paused) {

            audio.pause();
            playBtn.innerHTML = '<i class="fa-solid fa-play"></i>';

            return;
        }

        // STOP PREVIOUSLY PLAYING AUDIO
        if (
            currentlyPlayingAudio &&
            currentlyPlayingAudio !== audio
        ) {

            currentlyPlayingAudio.pause();

            currentlyPlayingAudio.currentTime = 0;

            if (currentlyPlayingButton) {
                currentlyPlayingButton.innerHTML = '<i class="fa-solid fa-play"></i>';
            }
        }

        // Remember this audio BEFORE playing
        currentlyPlayingAudio = audio;
        currentlyPlayingButton = playBtn;

        try {

            await audio.play();

            playBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';

        } catch (error) {

            console.error(
                "AUDIO PLAY FAILED:",
                error
            );

            currentlyPlayingAudio = null;
            currentlyPlayingButton = null;

            playBtn.innerHTML = '<i class="fa-solid fa-play"></i>';
        }

    });


    // ENDED
    audio.addEventListener(
        "ended",
        () => {

            playBtn.innerHTML = '<i class="fa-solid fa-play fa-sm"></i>';

            audio.currentTime = 0;

            if (currentlyPlayingAudio === audio) {
                currentlyPlayingAudio = null;
                currentlyPlayingButton = null;
            }

            if (originalDuration > 0) {

                duration.textContent =
                    formatAudioTime(
                        originalDuration
                    );

            }

        }
    );

    // ERROR
    audio.addEventListener(
        "error",
        () => {

            console.error(
                "========== AUDIO ERROR =========="
            );

            console.error(
                "URL:",
                msg.media_url
            );

            console.error(
                "Audio error:",
                audio.error
            );

            console.error(
                "================================"
            );

        }
    );

    // SOURCE
    audio.src = msg.media_url;
    audio.load();

    // FORCE WEBM DURATION DETECTION
    const metadataAudio = document.createElement("audio");

    metadataAudio.preload = "metadata";
    metadataAudio.src = msg.media_url;

    metadataAudio.addEventListener(
        "loadedmetadata",
        () => {

            console.log(
                "METADATA AUDIO DURATION:",
                metadataAudio.duration
            );

            if (
                Number.isFinite(metadataAudio.duration) &&
                metadataAudio.duration > 0
            ) {

                originalDuration =
                    metadataAudio.duration;

                duration.textContent =
                    formatAudioTime(
                        originalDuration
                    );

                return;
            }

            if (metadataAudio.duration === Infinity) {

                console.log("METADATA AUDIO = INFINITY, SEEKING...");

                try {

                    metadataAudio.currentTime = 1e10;

                } catch (error) {

                    console.error("Metadata seek failed:",error);

                }

            }

        }
    );


    metadataAudio.addEventListener(
        "durationchange",
        () => {

            console.log(
                "METADATA DURATION CHANGE:",
                metadataAudio.duration
            );

            if (
                Number.isFinite(metadataAudio.duration) &&
                metadataAudio.duration > 0
            ) {

                originalDuration =
                    metadataAudio.duration;

                duration.textContent =
                    formatAudioTime(
                        originalDuration
                    );

            }

        }
    );

    metadataAudio.load();

    // ADD TO DOM
    audioWrapper.appendChild(playBtn);
    audioWrapper.appendChild(duration);
    audioWrapper.appendChild(audio);

    return audioWrapper;
}


function scrollToRepliedMessage(messageId) {
    const target = document.querySelector(
        `.message[data-message-id="${messageId}"]`
    );

    if (!target) {
        console.log("Original message not found:", messageId);
        return;
    }

    target.scrollIntoView({
        behavior: "smooth",
        block: "center"
    });

    // Highlight it temporarily
    target.classList.add("reply-highlight");

    setTimeout(() => {
        target.classList.remove("reply-highlight");
    }, 1500);
}

function createReplyPreview(msg) {

    if (!msg.reply_to) {
        return null;
    }

    const replyBox = document.createElement("div");

    replyBox.className = "reply-preview";

    // Make it clickable later
    replyBox.dataset.replyMessageId = msg.reply_to.id;

    const replySender = document.createElement("div");

    replySender.className = "reply-preview-sender";

    replySender.textContent =
        msg.reply_to.sender || "Deleted User";


    const replyContent = document.createElement("div");

    replyContent.className = "reply-preview-content";


    // Text reply
    if (
        msg.reply_to.message_type === "text" &&
        msg.reply_to.message
    ) {

        replyContent.textContent =
            msg.reply_to.message;

    }

    // Image reply
    else if (
        msg.reply_to.message_type === "image"
    ) {

        replyContent.textContent =
            "🖼️ Image";

    }

    // Audio reply
    else if (
        msg.reply_to.message_type === "audio"
    ) {

        replyContent.textContent = "🎤 Voice message";

    }

    else {

        replyContent.textContent = "Message";

    }


    replyBox.appendChild(replySender);
    replyBox.appendChild(replyContent);


    return replyBox;
}

}

  // render messages array
  function renderMessages(messages) {
  const messagesDiv = document.getElementById("messages");
  
  // Check scroll position BEFORE clearing messages
  const wasNearBottom =
      messagesDiv.scrollHeight -
      messagesDiv.scrollTop -
      messagesDiv.clientHeight < 50;

  messagesDiv.innerHTML = "";

  messages.forEach(msg => {
    // wrapper row
    const row = document.createElement("div");
    row.className = msg.sender === username ? "message-row me" : "message-row other";

    // avatar circle (only for received messages)
    if (msg.sender !== username) {
      const avatar = document.createElement("div");
      
      avatar.className = "avatar-circle-public";
      avatar.style.backgroundColor = msg.avatar_color;
      avatar.textContent = (msg.sender || "?").charAt(0).toUpperCase(); // initial character of sender
      avatar.setAttribute("data-username", msg.sender);

      const statusDot = document.createElement("span");
      statusDot.className = `status-dot-public ${isUserOnline(msg.sender) ? 'status-online' : 'status-hidden'}`;
      avatar.appendChild(statusDot);

      row.appendChild(avatar);
    }

    // bubble
    const bubble = document.createElement("div");
    bubble.className = msg.sender === username ? "message me" : "message other";
    bubble.dataset.messageId = msg.id;

    // sender
    const sender = document.createElement("strong");
    if (msg.deleted_user) {
        sender.textContent = "Deleted User";
        sender.classList.add("deleted-user");
    } else {
        sender.textContent = msg.sender === username ? "You" : msg.sender;
    }
    
    bubble.appendChild(sender);

    // Reply preview
    const replyPreview = createReplyPreview(msg);

    if (replyPreview) {
        
        replyPreview.style.cursor = "pointer";

        replyPreview.addEventListener("click", () => {
            scrollToRepliedMessage(msg.reply_to.id);
        });

        bubble.appendChild(replyPreview);
    }

    // Message content
    if (msg.message) {

        const msgText = document.createElement("div");

        msgText.style.whiteSpace = "pre-wrap";

        msgText.textContent = msg.message;

        bubble.appendChild(msgText);
    }


    // Image content
    if ((msg.message_type === "image" || msg.type === "image") && msg.media_url) {

        const image = document.createElement("img");

        image.src = msg.media_url;
        image.className = "chat-message-image";
        image.alt = "Image";

        image.addEventListener("click", () => {

            window.open(msg.media_url, "_blank");

        });

        // Scroll again after the image has finished loading
        image.addEventListener("load", () => {
            if (wasNearBottom) {
                scrollMessagesToBottom("auto");
            }
        });

        bubble.appendChild(image);
    }

    // Audio content
    if ((msg.message_type === "audio" || msg.type === "audio") && msg.media_url) 
    {

        console.log("RENDER AUDIO:", {
            id: msg.id,
            url: msg.media_url,
            message_type: msg.message_type,
            type: msg.type
        });

        const audioWrapper = createAudioMessage(msg);

        bubble.appendChild(audioWrapper);
    }


    // horizontal line
    const footer = document.createElement("div");
    footer.className = "msg-footer";

    const divider = document.createElement("div");
    divider.className = "msg-divider";
    footer.appendChild(divider);
    
    // timestamp
    const time = document.createElement("small");
    time.className = "timestamp text-muted d-block";
    
    time.textContent = formatTime(msg.sent_at);
    
    // Read status (only my messages)
    if(msg.sender === username){

        const readStatus = document.createElement("span");

        readStatus.className = "read-status ms-1";

        readStatus.dataset.messageId = msg.id;

        readStatus.innerHTML =
            (msg.is_read || msg.public_seen)
            ? "✓✓"
            : "✓";


        if (msg.public_seen) {
            readStatus.classList.add("black");
        }

        time.appendChild(readStatus);
    }

    //bubble.appendChild(time);
    footer.appendChild(time);
    bubble.appendChild(footer);

    // Message + reply button wrapper
    const messageWrapper = document.createElement("div");

    messageWrapper.className = "message-content-wrapper";

    messageWrapper.appendChild(bubble);


    // Reply button ONLY for other user's messages
    if (msg.sender !== username) {
        messageWrapper.appendChild(createReplyButton(msg));
    }

    row.appendChild(messageWrapper);
    messagesDiv.appendChild(row);
  });

  //messagesDiv.scrollTop = messagesDiv.scrollHeight;
  scrollMessagesToBottom("auto");
  /*if (wasNearBottom || messagesDiv.scrollHeight === 0) {
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }*/
}

// Handle incoming WebSocket messages
async function handleIncomingMessage(event) {
  const data = JSON.parse(event.data);

  // typing behavior
if (data.type === "typing") {

    console.log("RECEIVED TYPING:", data);

    // PUBLIC CHAT
    if (!currentReceiver) {

        // Ignore my own typing event
        if (data.username === username) {
            return;
        }

        console.log(
            "PUBLIC TYPING RECEIVED:",
            data
        );

        if (data.is_typing) {

            typingUsers.add(data.username);

        } else {

            typingUsers.delete(data.username);

        }

        console.log(
            "CURRENT TYPING USERS:",
            [...typingUsers]
        );

        updateTypingIndicator();

        return;
    }

    // PRIVATE CHAT
    showTypingStatus(
        data.username,
        data.typing
    );

    return;
}

  if(data.type === "messages_seen"){

      console.log(
          "Messages seen by:",
          data.reader
      );
  
      updateReadStatus(data.last_read_id);
  
      return;
  }

  // Public chat read receipt
  if(data.type === "public_message_seen"){

      console.log(
          "PUBLIC MESSAGE SEEN:",
          data.message_id
      );


      const tick = document.querySelector(
          `.read-status[data-message-id="${data.message_id}"]`
      );


      if(tick){

          tick.innerHTML = "✓✓";

          tick.classList.add("blue");

      }


      return;
  }
  

  if (data.type === "message") {
    
    // Play sound immediately
    if (data.sender !== username) {
        document.getElementById("receiveSound").play();
    } else {
        document.getElementById("sendSound").play();
    }

    
    // Public Chat
    if (!currentReceiver && data.room_type === "public") {

        appendMessageRow(data);
        
        // tell server we viewed public message
        if(
            data.sender !== username &&
            ws &&
            ws.readyState === WebSocket.OPEN
        ){

            ws.send(JSON.stringify({
                type:"public_seen",
                message_id:data.id
            }));

        }

    }

    // Private Chat
    if (currentReceiver) {

        if (
            data.sender === currentReceiver ||
            data.sender === username
        ) {

            appendMessageRow(data);
            
            // auto mark as read
            if(
                data.sender === currentReceiver &&
                ws &&
                ws.readyState === WebSocket.OPEN
            ){

                if(data.id > lastReadMessageId){

                    lastReadMessageId = data.id;

                    ws.send(JSON.stringify({
                        type:"mark_read",
                        receiver: currentReceiver
                    }));

                }

            }

        }
    }

    // Update recent chats
    if (data.room_type === "private") {

        let chatUser =
            data.sender === username
            ? data.receiver
            : data.sender;

        let previewMessage = data.message || "";

        // Keep image indicator in recent chat preview
        if (data.message_type === "image" || data.type === "image") {

            previewMessage = "🖼️ Image";

            if (data.message && data.message.trim()) {
                previewMessage += ": " + data.message;
            }
        } else if (data.message_type === "audio" || data.type === "audio") {

            previewMessage = "🎤 Voice message";
        }
        
        updateSidebarChat({
            sender: chatUser,
            last_sender: data.sender === username ? "You" : data.sender,
            message: previewMessage,
            //message: data.message,
            sent_at: data.sent_at
        });

    }

    return;
  }


  if(data.type === "chat_update"){

    let chatUser;

    // message from another user
    if(data.sender !== username){
        
        chatUser = data.sender;

        if(currentReceiver !== chatUser){
            console.log("ADDING UNREAD BADGE FOR:", chatUser);
            
            unreadCounts[chatUser] = (unreadCounts[chatUser] || 0) + 1;
        }

        if(!document.querySelector(
            `button[data-username="${chatUser}"]`
        )){
            newChatUsers[chatUser] = true;
        }
    }
    else{
        // my own sent message
        chatUser = data.receiver;

    }

    updateSidebarChat({        
        // calling from websocket
        sender: chatUser,
        avatar_color: data.avatar_color,
        last_sender: data.last_sender,
        message: data.message,
        sent_at: data.sent_at

    });

    if(currentReceiver !== chatUser){
        updateUnreadBadge(chatUser);
    }

    return;
}

  if (data.type === "presence") {

    onlineUsers[data.username] = data.online;   // ✅ keep map updated

    if(data.last_seen){
        lastSeenUsers[data.username] = data.last_seen;
    }
    
    updateUserStatus(
        data.username, 
        data.online,
        data.last_seen
    );

    return; // stop here, don’t render as a chat bubble

  }

  if (data.type === "presence_init") {

    // clear old online cache
    /*Object.keys(onlineUsers).forEach(u => {
        delete onlineUsers[u];
    });*/
    
    data.users.forEach(u => {

      onlineUsers[u.username] = u.online;     // ✅ keep map updated
      if(u.last_seen){
            lastSeenUsers[u.username] = u.last_seen;
        }

      updateUserStatus(u.username, u.online, u.last_seen);

    });

    updatePublicStats();
    return;
  }

    if(data.type === "new_chat"){
        
        console.log("NEW CHAT CREATED:", data.username);

        newChatUsers[data.username] = true;

        setTimeout(()=>{
            loadChats();
        },100);

        return;
    }

}

// last seen format
function formatLastSeen(time){

    if(!time){
        return "last seen recently";
    }

    const date = new Date(time);

    if(isNaN(date.getTime())){
        console.log("Invalid last_seen:", time);
        return "last seen recently";
    }


    const diff = Math.floor(
        //(new Date() - date) / 60000
        (Date.now() - date.getTime()) / 60000
    );


    if(diff < 1)
        return "last seen just now";


    if(diff < 60)
        return `last seen ${diff} min ago`;


    const hours = Math.floor(diff / 60);


    if(hours < 24)
        return `last seen ${hours} hour ago`;


    const days = Math.floor(hours / 24);

    return `last seen ${days} day ago`;
}

function showTypingStatus(user, typing){

    // only affect current private chat
    if(currentReceiver !== user){
        return;
    }


    const status = document.querySelector(
        "#chatHeader .status"
    );


    if(!status){
        return;
    }


    if(typing){

        status.className = "status online-text";


        if(!typingAnimationTimer){

            typingDots = 0;

            typingAnimationTimer = setInterval(()=>{

                typingDots++;

                if(typingDots > 3){
                    typingDots = 0;
                }


                status.textContent = ".".repeat(typingDots) + "typing";

            },400);

        }


    }else{

        // stop animation
        if(typingAnimationTimer){

            clearInterval(typingAnimationTimer);

            typingAnimationTimer = null;

        }


        status.textContent =
            isUserOnline(user)
            ? "online"
            : formatLastSeen(lastSeenUsers[user]);


        status.className =
            `status ${
                isUserOnline(user)
                ? "online-text"
                : "offline-text"
            }`;

    }

}


// Helper to connect WebSocket
function connectWebSocket(url) {

    const currentSocketId = ++socketId;
    let intentionalClose = false;

  // Cancel previous reconnect timer
  if (reconnectTimer) {
    clearTimeout(reconnectTimer);
    reconnectTimer = null;
  }

  // Close old connection intentionally
  if (ws) {

    ws.onclose = null;
    ws.onerror = null;

    intentionalClose = true;

    ws.close();
  }

  ws = new WebSocket(url);


  //document.getElementById("sendBtn").disabled = true;
  const sendBtn = document.getElementById("sendBtn");

  if(sendBtn){
      sendBtn.disabled = true;
  }

  ws.onopen = () => {

        if(currentSocketId !== socketId){
            return;
        }

        console.log("WS OPEN");
        console.log("Connected to " + url);

        //manualClose = false;

        if(sendBtn){
            sendBtn.disabled = false;
        }

        // Private chat
        if(currentReceiver && url.includes("receiver=")){

            if(ws.readyState === WebSocket.OPEN){

                ws.send(JSON.stringify({
                    type:"mark_read",
                receiver: currentReceiver
                }));

            }

            console.log("Private chat opened -> mark_read sent");
        }
        

        // Wait until websocket is connected before sending public_seen
        // Public Chat
        if (
            currentReceiver === null &&
            currentSocketId === socketId
        ){
            loadPublicMessages();
        }

        // refresh recent chats after websocket ready
        setTimeout(() => {

            if(currentSocketId !== socketId){
                return;
            }
            loadChats();

        }, 500);
  };


  ws.onmessage = handleIncomingMessage;

  ws.onclose = (e) => {
    
    console.log("WS CLOSED", e.code);
    // Ignore old websocket closing
    if(currentSocketId !== socketId){
        console.log("Old websocket ignored");
        return;
    }

    console.log("Closed:", e.code, e.reason);

    //document.getElementById("sendBtn").disabled = true;
    if(currentSocketId === socketId){

        document.getElementById("sendBtn").disabled = true;

    }


    // Ignore intentional close
    if (intentionalClose) {
      console.log("Manual close, no reconnect");
      return;
    }


    reconnectTimer = setTimeout(() => {

      console.log("Attempting reconnect...");

      connectWebSocket(url);

      // refresh recent chats after reconnect
      loadChats();

    },3000); // auto reconnect after 3s
    
  };


  ws.onerror = (err) => {
    console.error("WebSocket error:", err);
  };
}

async function sendMessage() {

        return;

    // WebSocket must be ready
    if (!ws || ws.readyState !== WebSocket.OPEN) {
        alert("Connection not ready yet. Please wait a moment.");
        return;
    }

    // SEND PENDING VOICE MESSAGE
    if (pendingVoiceMessage) {

        const voice = pendingVoiceMessage;

        pendingVoiceMessage = null;

        const success = await sendVoiceMessage(
            voice.audioBlob,
            voice.mimeType,
            voice.duration,
            replyingToMessageId
        );

            clearReplyPreview();
        }

        input.value = "";
        input.style.height = "24px";

function getWebSocketUrl(path) {
    const protocol = location.protocol === "https:" 
        ? "wss://" 
        : "ws://";

    return protocol + location.host + path;
}

// for private chat switching
function openPrivateChat(user) {

    if (!user || !user.username) 
    {
        return;
    }

    // Immediately clear typing indicator from previous room
    clearTypingIndicator();

    // Stop typing state
    isTyping = false;

    clearTimeout(typingTimer);

    currentReceiver = user.username;
    lastReadMessageId = 0;

    // Clear unread
    unreadCounts[user.username] = 0;

    delete newChatUsers[user.username];

    updateUnreadBadge(user.username);

    // Connect to private WebSocket
    connectWebSocket(
        getWebSocketUrl(
            "/ws?username=" +
            encodeURIComponent(username) +
            "&receiver=" +
            encodeURIComponent(user.username)
        )
    );

// START REPLY
function startReply(message) {

    if (!message || !message.id) {
        return;
    }

    replyingToMessageId = message.id;
    replyingToMessage = message;

    const preview = document.getElementById("replyPreview");
    const sender = document.getElementById("replyPreviewSender");
    const messageText = document.getElementById("replyPreviewMessage");

    if (!preview || !sender || !messageText) {
        return;
    }

    // Sender name
    sender.textContent =
        message.deleted_user
        ? "Deleted User"
        : (message.sender || "Unknown");

    let previewText = "";

    const messageType =
        message.message_type || message.type;

    // IMAGE
    if (messageType === "image") {

        previewText = "🖼️ Image";

        if (message.message && message.message.trim()) {
            previewText += ": " + message.message;
        }

    }

    // AUDIO
    else if (messageType === "audio") {

        previewText = "🎤 Voice message";

    }

    // TEXT
    else {

        previewText = message.message || "";

    }

    messageText.textContent = previewText;

    // Show reply preview
    preview.classList.remove("d-none");

    // Focus message input
    const input = document.getElementById("messageText");

    if (input) {
        input.focus();
    }

    console.log("REPLYING TO MESSAGE:", message);
    console.log("REPLY MESSAGE ID:", replyingToMessageId);
}

let previewAudioObjectUrl = null;

function showAudioPreview(audioBlob, duration) {

    const preview = document.getElementById("audioPreview");
    const audio = document.getElementById("previewAudio");
    const playBtn = document.getElementById("previewAudioPlay");
    const durationText = document.getElementById("previewAudioDuration");

    // Release previous preview URL
    if (previewAudioObjectUrl) {
        URL.revokeObjectURL(previewAudioObjectUrl);
    }

    // Create local blob URL
    previewAudioObjectUrl = URL.createObjectURL(audioBlob);

    audio.src = previewAudioObjectUrl;

    // Show duration immediately from recording
    durationText.textContent = formatAudioTime(duration);

    preview.classList.remove("d-none");

    // Reset button
    playBtn.innerHTML = '<i class="fa-solid fa-play"></i>';

    // Play / pause preview
    playBtn.onclick = async function () {

        try {

            if (audio.paused) {

                await audio.play();
                playBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';

            } else {

                audio.pause();
                playBtn.innerHTML = '<i class="fa-solid fa-play"></i>';

            }

        } catch (error) {

            console.error(
                "Preview audio failed:",
                error
            );

        }

    };

    // When preview finishes
    audio.onended = function () {

        playBtn.innerHTML =
            '<i class="fa-solid fa-play"></i>';

        audio.currentTime = 0;

    };

    console.log(
        "AUDIO PREVIEW SHOWN:",
        audioBlob.size,
        audioBlob.type,
        duration
    );
}

function clearAudioPreview() {
    const preview = document.getElementById("audioPreview");
    const audio = document.getElementById("previewAudio");
    const playBtn = document.getElementById("previewAudioPlay");

    if (audio) {
        audio.pause();
        audio.currentTime = 0;
        audio.src = "";
    }

    if (previewAudioObjectUrl) {
        URL.revokeObjectURL(previewAudioObjectUrl);
        previewAudioObjectUrl = null;
    }

    preview.classList.add("d-none");

    playBtn.innerHTML = '<i class="fa-solid fa-play"></i>';

    pendingVoiceMessage = null;
}
document.getElementById("removeAudioPreview")
    .addEventListener(
        "click",
        clearAudioPreview
    );

// Store when recording started
let recordingStartTime = 0;

// Find supported recording format
function getSupportedAudioMimeType() {

    const types = [
        "audio/webm;codecs=opus",
        "audio/webm",
        "audio/ogg;codecs=opus",
        "audio/ogg",
        "audio/mp4"
    ];

    for (const type of types) {

        if (MediaRecorder.isTypeSupported(type)) {
            console.log("Using audio format:", type);
            return type;
        }
    }

    return "";
}


// Start / stop recording
document.getElementById("micBtn").addEventListener("click", async function () {

        // STOP RECORDING
        if (isRecording) {

            console.log("Stopping recording...");

            mediaRecorder.stop();

            return;
        }


        // CHECK BROWSER SUPPORT
        if (
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ) {

            alert(
                "Microphone recording is not supported by this browser."
            );

            return;
        }


        // CHECK WEBSOCKET
        if (
            !ws ||
            ws.readyState !== WebSocket.OPEN
        ) {

            alert(
                "Connection not ready yet. Please wait a moment."
            );

            return;
        }


        try {

            // Request microphone
            const stream =
                await navigator.mediaDevices.getUserMedia({
                    audio: true
                });


            audioChunks = [];


            // Find supported format
            const mimeType =
                getSupportedAudioMimeType();


            if (!mimeType) {

                stream
                    .getTracks()
                    .forEach(track => track.stop());

                alert(
                    "Your browser does not support audio recording."
                );

                return;
            }


            console.log(
                "RECORDING MIME TYPE:",
                mimeType
            );


            // CREATE RECORDER
            mediaRecorder =
                new MediaRecorder(
                    stream,
                    {
                        mimeType: mimeType
                    }
                );


            // RECEIVE AUDIO DATA
            mediaRecorder.ondataavailable =
                function (event) {

                    console.log(
                        "AUDIO CHUNK:",
                        event.data.size
                    );

                    if (
                        event.data &&
                        event.data.size > 0
                    ) {

                        audioChunks.push(
                            event.data
                        );
                    }
                };


            // RECORDING ERROR
            mediaRecorder.onerror =
                function (event) {

                    console.error(
                        "MEDIA RECORDER ERROR:",
                        event.error
                    );

                    stream
                        .getTracks()
                        .forEach(track =>
                            track.stop()
                        );

                    resetMicButton();
                };


            // RECORDING STOPPED
            mediaRecorder.onstop = async function () {

                    console.log("RECORDING STOPPED");

                    // Calculate recording duration
                    const recordingDuration =
                        (Date.now() - recordingStartTime) / 1000;

                    console.log(
                        "RECORDING DURATION:",
                        recordingDuration
                    );

                    // Stop microphone
                    stream.getTracks().forEach(
                        track =>  track.stop()
                    );


                    console.log("TOTAL AUDIO CHUNKS:", audioChunks.length);

                    // CANCELLED
                    if (cancelRecording) {

                        console.log("RECORDING CANCELLED");

                        audioChunks = [];
                        mediaRecorder = null;
                        cancelRecording = false;

                        resetMicButton();

                        return;
                    }


                    if (
                        audioChunks.length === 0
                    ) {

                        console.error(
                            "NO AUDIO CHUNKS"
                        );

                        resetMicButton();

                        return;
                    }


                    // CREATE AUDIO BLOB
                    const audioBlob =
                        new Blob(
                            audioChunks,
                            {
                                type: mimeType
                            }
                        );


                    console.log("AUDIO BLOB:", audioBlob.size, audioBlob.type);

                    if (
                        audioBlob.size === 0
                    ) {

                        console.error(
                            "EMPTY AUDIO BLOB"
                        );

                        resetMicButton();

                        return;
                    }

                    // UPLOAD
                    /*await sendVoiceMessage(
                        audioBlob,
                        mimeType,
                        recordingDuration
                    );

                    audioChunks = [];
                    mediaRecorder = null;*/

                    // SAVE VOICE MESSAGE FOR SEND BUTTON
                    pendingVoiceMessage = {
                        audioBlob: audioBlob,
                        mimeType: mimeType,
                        duration: recordingDuration
                    };
                    
                    showAudioPreview(
                        audioBlob,
                        recordingDuration
                    );

                    console.log("VOICE MESSAGE READY TO SEND:", pendingVoiceMessage);

                    audioChunks = [];
                    mediaRecorder = null;

                    resetMicButton();
                };


            // START RECORDING
            mediaRecorder.start(100);

            // Play microphone click sound
            const micClickSound = document.getElementById("micClickSound");

            micClickSound.currentTime = 0;
            micClickSound.play().catch(error => {
                console.log("Mic click sound could not play:", error);
            });

            // Save recording start time
            recordingStartTime = Date.now();

            isRecording = true;

            // Change mic button
            const micBtn = document.getElementById("micBtn");

            micBtn.classList.add("recording");

            micBtn.innerHTML = '<i class="fa-solid fa-stop fa-lg"></i>';
            micBtn.title = "Stop recording";
            cancelMicBtn.style.display = "inline-flex";

            // SHOW RECORDING TEXT
            const recordingText = document.getElementById("recordingText");

            const messageText = document.getElementById("messageText");

            recordingText.style.display = "block";
            messageText.style.display = "none";

            console.log("VOICE RECORDING STARTED");

        } catch (error) {

            console.error(
                "MICROPHONE ERROR:",
                error
            );

            alert(
                "Microphone permission is required to record a voice message."
            );

            resetMicButton();
        }
    }
);

// Reset microphone button
function resetMicButton() {

    isRecording = false;
    const micBtn = document.getElementById("micBtn");
    const cancelBtn = document.getElementById("cancelMicBtn");
    const recordingText = document.getElementById("recordingText");
    const messageText = document.getElementById("messageText");

    micBtn.classList.remove("recording");

    micBtn.innerHTML = '<i class="fa-solid fa-microphone fa-lg"></i>';

    micBtn.title = "Voice message";
    cancelBtn.style.display = "none";

    // SHOW MESSAGE BOX AGAIN
    recordingText.style.display = "none";
    messageText.style.display = "block";
}


async function sendVoiceMessage(audioBlob, mimeType, recordingDuration, replyToId = null) {

    resetMicButton();

    if (!ws || ws.readyState !== WebSocket.OPEN) {
        alert("Connection not ready yet. Please wait a moment.");
        return false;
    }

    // Determine extension
    let extension = ".webm";

    if (mimeType.includes("ogg")) {
        extension = ".ogg";
    } else if (mimeType.includes("mp4")) {
        extension = ".mp4";
    }

    const audioFile = new File(
        [audioBlob],
        "voice-message" + extension,
        {
            type: mimeType
        }
    );

    console.log("VOICE FILE:", {
        name: audioFile.name,
        type: audioFile.type,
        size: audioFile.size
    });

    const formData = new FormData();

    formData.append("file", audioFile);

    try {

        // UPLOAD AUDIO
        const response = await fetch("/upload_media", {
            method: "POST",
            body: formData
        });

        if (!response.ok) {
            throw new Error(
                "Upload failed: HTTP " + response.status
            );
        }

        const data = await response.json();

        console.log("AUDIO UPLOAD RESPONSE:", data);

        if (!data.success || !data.media_url) {

            alert(
                data.message || "Voice message upload failed."
            );

            return false;
        }

        console.log(
            "AUDIO URL:",
            data.media_url
        );


        // SEND THROUGH WEBSOCKET
        const messageData = {
            type: "audio",
            message_type: "audio",
            media_url: data.media_url,
            message: "",
            duration: recordingDuration,
            reply_to_id: replyToId
        };

        console.log(
            "SENDING AUDIO THROUGH WS:",
            messageData
        );

        ws.send(JSON.stringify(messageData));
        return true;

    } catch (error) {

        console.error(
            "Voice upload error:",
            error
        );

        alert(
            "Failed to upload voice message."
        );

        return false;
    }
}

// cancel recording
const cancelMicBtn = document.getElementById("cancelMicBtn");

let cancelRecording = false;

cancelMicBtn.addEventListener("click", function () {

    if (!isRecording || !mediaRecorder) {
        return;
    }

    console.log("CANCEL RECORDING");

    // Tell onstop not to upload
    cancelRecording = true;

    // Stop recorder
    mediaRecorder.stop();
});



// typing indicator
function updateTypingIndicator() {

    const indicator = document.getElementById("typingIndicator");

    if (!indicator) {
        console.log("TYPING INDICATOR ELEMENT NOT FOUND");
        return;
    }

    // PUBLIC CHAT ONLY
    if (currentReceiver) {
        indicator.classList.remove("show");
        indicator.classList.add("d-none");
        return;
    }

    if (typingUsers.size === 0) {

        indicator.textContent = "";

        indicator.classList.remove("show");
        indicator.classList.add("d-none");

        return;
    }

    let text;

    if (typingUsers.size === 1) {

        const user = [...typingUsers][0];

        text = `${user} is typing`;

    } else if (typingUsers.size === 2) {

        const users = [...typingUsers];

        text = `${users[0]} and ${users[1]} are typing`;

    } else {

        text = `${typingUsers.size} people are typing`;

    }

    indicator.textContent = text;

    indicator.classList.remove("d-none");
    indicator.classList.add("show");

    // Move indicator underneath latest message
    const messagesDiv = document.getElementById("messages");

    //messagesDiv.appendChild(indicator);

    // Optional: keep bottom visible
    //messagesDiv.scrollTop = messagesDiv.scrollHeight;

    // Keep the indicator visible only if user is already near bottom
    const wasNearBottom =
        messagesDiv.scrollHeight -
        messagesDiv.scrollTop -
        messagesDiv.clientHeight < 50;

    if (wasNearBottom) {
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }
}

function clearTypingIndicator() {

    const indicator = document.getElementById("typingIndicator");

    if (indicator) {
        indicator.textContent = "";
        indicator.classList.remove("show");
        indicator.classList.add("d-none");
    }

    // Remove all users from the previous public-chat typing state
    typingUsers.clear();

    // Stop pending typing timeout
    clearTimeout(typingTimeout);
    typingTimeout = null;

    isCurrentlyTyping = false;
}

function sendTypingStatus(isTyping) {

    if (!ws || ws.readyState !== WebSocket.OPEN) {
        return;
    }

    /*ws.send(JSON.stringify({
        type: "typing",
        username: username,
        is_typing: isTyping
    }));*/
    ws.send(JSON.stringify({
        type: isTyping ? "typing" : "stop_typing"
    }));
}


let typingTimeout = null;
let isCurrentlyTyping = false;

const messageInput = document.getElementById("messageText");

messageInput.addEventListener("input", () => {

    if (!ws || ws.readyState !== WebSocket.OPEN) {
        return;
    }

    // Empty message → stop typing
    if (!messageInput.value.trim()) {

        clearTimeout(typingTimeout);

        if (isCurrentlyTyping) {
            isCurrentlyTyping = false;
            sendTypingStatus(false);
        }

        return;
    }

    // Only send "typing" ONCE when typing starts
    if (!isCurrentlyTyping) {

        isCurrentlyTyping = true;

        sendTypingStatus(true);
    }

    // Reset the stop timer every time user types
    clearTimeout(typingTimeout);

    typingTimeout = setTimeout(() => {

        if (isCurrentlyTyping) {

            isCurrentlyTyping = false;

            sendTypingStatus(false);
        }

    }, 1500);
});
